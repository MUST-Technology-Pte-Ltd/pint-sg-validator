name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - name: stdin marker reads the document
        shell: bash
        run: |
          cargo build --release
          ./target/release/pintsg - < tests/fixtures/valid_invoice.xml

# Build release binaries on a version tag and attach them to a GitHub Release.
#
# Pure-Rust dependencies, so cross-compilation is uneventful. Binaries are
# unsigned — a signed installer is a separate concern (a code-signing
# certificate this workflow does not carry); for a CLI, `cargo install` or a
# direct download is the norm. Tag with `vX.Y.Z` to trigger.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: pintsg
            asset: pintsg-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: pintsg.exe
            asset: pintsg-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: pintsg
            asset: pintsg-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
